# Merge into the EXISTING xss6.com server {} block.
# Keep the final slash on proxy_pass: /stillscape/api/... becomes /api/... upstream.
location = /stillscape {
    return 308 /stillscape/$is_args$args;
}

# ^~ prevents existing site-wide image/CSS/JS regex rules from intercepting this app.
location ^~ /stillscape/ {
    proxy_pass http://127.0.0.1:4178/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_connect_timeout 10s;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;
    proxy_redirect off;
}
